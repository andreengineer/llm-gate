# LADDER_V2.md — index floor. Boot rejects any non-free rung below this.
# NOTE: these index values are the operator's supplied AA figures and are
# UNVERIFIED — a 2026-08-04 fetch of artificialanalysis.ai returned a
# different scale and a different ordering, and listed no GLM models at all.
# Treat routing decisions that hinge on them as provisional.
min_index: 45

# I7_MAIN.md §2.1 — DeepSeek peak pricing (2x). Anchors are UTC hours
# [start, end), Mon-Fri only. The old 16:30-00:30 window was wrong and is gone.
# holidays_cst: Chinese public holidays (China calendar date) are off-peak 24h.
# Add a year's block only after checking the State Council notice.
deepseek_pricing:
  peak_windows_utc: [[1, 4], [6, 10]]
  holidays_cst:
    - 2026-10-01
    - 2026-10-02
    - 2026-10-03
    - 2026-10-04
    - 2026-10-05
    - 2026-10-06
    - 2026-10-07

ladder:
  # I7_MAIN.md §2.5 — Ladder A, AVAILABILITY only. A hop must never cost more
  # per token than rung 1 unless it is capped. Capped at max_provider_hops (3).
  # This ladder must NEVER cross into the quality ladder below.
  # Gemini (aistudio) is intentionally NOT here: its free tier trains on the
  # data, so it is cron/background-only and never isaura (adapter kept dormant).
  - rung: 1
    provider: deepseek          # cheap because of cache (99.4% hits Jun-Jul)
    model: deepseek/deepseek-flash
    tier: cheap
    free: false
    index: 50
    client_ok: true             # isaura's ONLY rung (§2.6: rung 1 only, never free)
  - rung: 2
    provider: openrouter        # same model family, different account
    model: deepseek/deepseek-v4-flash
    tier: cheap
    free: false
    index: 50
    client_ok: false            # §2.6: isaura client-facing is rung 1 only
    provider_order: [DeepInfra, Novita]   # allow_fallbacks: false is forced in upstreams
    daily_cap_usd: 0.30         # $0.09 in / $0.18 out, NO implicit cache -> capped
  - rung: 3
    provider: zai               # Z.ai direct, free
    model: glm-4.7-flash
    tier: free
    free: true
    index: 47                   # floor-exempt: $0 changes the calculus (LADDER_V2 §2.1)
    client_ok: false
  - rung: 4
    provider: cerebras          # free, 1M tok/day, 5 RPM
    model: gpt-oss-120b
    tier: free
    free: true
    index: 45
    client_ok: false
  # Groq removed entirely (I7_MAIN §2.5): llama-3.3-70b-versatile left its free
  # table and 8K TPM is smaller than one 6.7k-token context.

remediation:
  unfunded: "wait for banking confirmation; nothing in the stack fixes an unfunded upstream"
  unauthorized: "regenerate this provider's key and set it in ~/llm-gate/.env"
  rate_limited: "free-tier quota/rate limit hit; recovers on its own — widen the ladder or wait"
  timeout: "upstream slow or unreachable; check connectivity, it may recover next probe"
  server_error: "upstream returned 5xx; transient on their side, retry next chain"
  unknown: "no successful probe yet; run GET /admin/health after the next probe cycle"
  truncated_reasoning: "reasoning used up max_tokens before any content; raise max_tokens or drop X-Think / thinking — the provider is fine"
  rung_cap: "this rung hit its own daily $ cap (e.g. rung 2 $0.30/day); resets at 00:00 UTC"

# ESCALATION_POLICY.md §2 — Ladder B, QUALITY only. Rises in cost, so it is
# tightly triggered (app/escalation.py: deterministic triggers only, never
# self-assessment). `blend` is populated AT BOOT from the live registry price
# fetch — never hardcode a price here; null means "resolve at boot". Rungs are
# partitioned by arithmetic against auto_ceiling_blend: over the ceiling ->
# above_ceiling (approval required), at or under -> automatic hop. `iq` orders
# rungs WITHIN a price band only; it never justifies skipping a cheaper rung.
quality_ladder:
  auto_ceiling_blend: 1.00
  max_auto_hops: 2
  rungs:
    - {model: deepseek/deepseek-flash,    provider: deepseek,   blend: null, index: 50}
    - {model: deepseek/deepseek-v4-flash, provider: openrouter, blend: null, index: 50}
    - {model: deepseek/deepseek-v4-pro,   provider: deepseek,   blend: null, index: 52}
    - {model: deepseek/deepseek-v4-pro,   provider: openrouter, blend: null, index: 52}
  above_ceiling: []
